2">Server</text><path d="M626.9087,1349.1719 C626.9087,1339.1719 644.9087,1339.1719 644.9087,1339.1719 C644.9087,1339.1719 662.9087,1339.1719 662.9087,1349.1719 L662.9087,1375.1719 C662.9087,1385.1719 644.9087,1385.1719 644.9087,1385.1719 C644.9087,1385.1719 626.9087,1385.1719 626.9087,1375.1719 L626.9087,1349.1719" fill="#E8DAEF" style="stroke:#8E44AD;stroke-width:0.5;"/><path d="M626.9087,1349.1719 C626.9087,1359.1719 644.9087,1359.1719 644.9087,1359.1719 C644.9087,1359.1719 662.9087,1359.1719 662.9087,1349.1719" fill="none" style="stroke:#8E44AD;stroke-width:0.5;"/></g><g><title>.NET API</title><rect fill="#FFFFFF" height="1130.0625" style="stroke:#181818;stroke-width:1;" width="10" x="334.9146" y="169.9219"/></g><g><title>MS SQL</title><rect fill="#FFFFFF" height="30.3516" style="stroke:#181818;stroke-width:1;" width="10" x="639.9087" y="331.0859"/></g><g><title>MS SQL</title><rect fill="#FFFFFF" height="432.8555" style="stroke:#181818;stroke-width:1;" width="10" x="639.9087" y="493.3711"/></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="322.9146,165.9219,332.9146,169.9219,322.9146,173.9219,326.9146,169.9219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="78.8931" x2="328.9146" y1="169.9219" y2="169.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.3716" x="122.718" y="148.7139">POST /orders/{id}/exchanges</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0215" x="88.3931" y="165.0654">{ orderItemId, newVariantId, qty, reason }</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#181818" points="627.9087,327.0859,637.9087,331.0859,627.9087,335.0859,631.9087,331.0859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="633.9087" y1="331.0859" y2="331.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.4434" x="386.1899" y="195.417">SELECT oi.variant_id AS old_var_id,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.0215" x="386.9009" y="211.7686">oi.unit_price_snapshot AS old_price,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2598" x="400.2817" y="228.1201">v2.price_incl_vat AS new_price,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.6689" x="425.5771" y="244.4717">v2.stock AS new_stock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.249" x="430.2871" y="260.8232">FROM order_items oi</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.8389" x="389.9922" y="277.1748">JOIN orders o ON o.id = oi.order_id</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.4634" x="375.1799" y="293.5264">JOIN variant v2 ON v2.id = newVariantId</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.1362" x="413.8435" y="309.8779">WHERE oi.id = orderItemId</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.0244" x="438.3994" y="326.2295">AND o.id = orderId</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg3"><polygon fill="#181818" points="355.9146,357.4375,345.9146,361.4375,355.9146,365.4375,351.9146,361.4375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="349.9146" x2="643.9087" y1="361.4375" y2="361.4375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.9941" x="359.4146" y="356.5811">{ old_var_id, old_price, new_price, new_stock }</text></g><path d="M10,376.4375 L70.1709,376.4375 L70.1709,384.7891 L60.1709,394.7891 L10,394.7891 L10,376.4375" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="916.5469" style="stroke:#000000;stroke-width:1.5;" width="855.4575" x="10" y="376.4375"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="25" y="390.9326">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="92.6084" x="85.1709" y="389.8564">[new_stock &lt; qty]</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg4"><polygon fill="#181818" points="89.8931,445.8438,79.8931,449.8438,89.8931,453.8438,85.8931,449.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="83.8931" x2="333.9146" y1="449.8438" y2="449.8438"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="68.6499" x="172.5789" y="412.2842">409 Conflict</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.3472" x="105.2302" y="428.6357">{ error: 'New variant has insufficient</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2153" x="114.7961" y="444.9873">stock. Available: ' + new_stock }</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="865.4575" y1="458.8438" y2="458.8438"/><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg5"><polygon fill="#181818" points="627.9087,489.3711,637.9087,493.3711,627.9087,497.3711,631.9087,493.3711" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="633.9087" y1="493.3711" y2="493.3711"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2363" x="423.7935" y="488.5146">BEGIN TRANSACTION</text></g><path d="M654,464.8438 L654,506.8438 L847,506.8438 L847,474.8438 L837,464.8438 L654,464.8438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M837,464.8438 L837,474.8438 L847,474.8438 L837,464.8438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3188" x="669" y="483.3389">Step 1 &#8212; Refund old variant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="30.3418" x="735.4885" y="499.6904">stock</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg7"><polygon fill="#181818" points="627.9087,563.6016,637.9087,567.6016,627.9087,571.6016,631.9087,567.6016" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="633.9087" y1="567.6016" y2="567.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3608" x="444.7312" y="530.042">UPDATE variant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.5508" x="424.1362" y="546.3936">SET stock = stock + qty</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.9189" x="423.9521" y="562.7451">WHERE id = old_var_id</text></g><path d="M654,522.7227 L654,564.7227 L840,564.7227 L840,532.7227 L830,522.7227 L654,522.7227" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M830,522.7227 L830,532.7227 L840,532.7227 L830,522.7227" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.0698" x="669" y="541.2178">Step 2 &#8212; Deduct from new</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9727" x="710.5486" y="557.5693">variant stock</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg9"><polygon fill="#181818" points="627.9087,626.6563,637.9087,630.6563,627.9087,634.6563,631.9087,630.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="633.9087" y1="630.6563" y2="630.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3608" x="444.7312" y="593.0967">UPDATE variant</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.2881" x="425.7676" y="609.4482">SET stock = stock - qty</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.8135" x="416.0049" y="625.7998">WHERE id = newVariantId</text></g><path d="M654,585.7773 L654,627.7773 L854,627.7773 L854,595.7773 L844,585.7773 L654,585.7773" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M844,585.7773 L844,595.7773 L854,595.7773 L844,585.7773" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.5488" x="669" y="604.2725">Step 3 &#8212; Compute and apply</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.979" x="724.2849" y="620.624">price delta</text><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg11"><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="386.9146" y1="677.3594" y2="677.3594"/><line style="stroke:#181818;stroke-width:1;" x1="386.9146" x2="386.9146" y1="677.3594" y2="690.3594"/><line style="stroke:#181818;stroke-width:1;" x1="345.9146" x2="386.9146" y1="690.3594" y2="690.3594"/><polygon fill="#181818" points="355.9146,686.3594,345.9146,690.3594,355.9146,694.3594,351.9146,690.3594" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.8008" x="395.4373" y="656.1514">price_delta =</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8462" x="351.9146" y="672.5029">(new_price - old_price) * qty</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg12"><polygon fill="#181818" points="627.9087,749.4141,637.9087,753.4141,627.9087,757.4141,631.9087,753.4141" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="633.9087" y1="753.4141" y2="753.4141"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="93.1899" x="445.8167" y="715.8545">UPDATE orders</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.2661" x="406.7786" y="732.2061">SET total = total + price_delta</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="118.1235" x="433.3499" y="748.5576">WHERE id = orderId</text></g><path d="M654,716.7109 L654,742.7109 L843,742.7109 L843,726.7109 L833,716.7109 L654,716.7109" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M833,716.7109 L833,726.7109 L843,726.7109 L833,716.7109" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.707" x="669" y="735.2061">Step 4 &#8212; Record exchange</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg14"><polygon fill="#181818" points="627.9087,828.8203,637.9087,832.8203,627.9087,836.8203,631.9087,832.8203" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="344.9146" x2="633.9087" y1="832.8203" y2="832.8203"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.3271" x="421.248" y="778.9092">INSERT INTO exchan