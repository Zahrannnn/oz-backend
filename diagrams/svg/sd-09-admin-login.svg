DD" style="stroke:#181818;stroke-width:0.5;"/><path d="M612.4243,166.5703 L612.4243,176.5703 L622.4243,176.5703 L612.4243,166.5703" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2744" x="483.4243" y="185.0654">No JWT cookie found</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.708" x="493.7075" y="201.417">&#8594; redirect to login</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg4"><polygon fill="#181818" points="64.8931,232.625,54.8931,236.625,64.8931,240.625,60.8931,236.625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="58.8931" x2="260.021" y1="236.625" y2="236.625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.1279" x="68.3931" y="231.7686">Login page (email + password)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg5"><polygon fill="#181818" points="244.021,262.9766,254.021,266.9766,244.021,270.9766,248.021,266.9766" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="53.8931" x2="250.021" y1="266.9766" y2="266.9766"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.6553" x="79.6294" y="262.1201">Enter credentials + submit</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg6"><polygon fill="#181818" points="481.4063,309.6797,491.4063,313.6797,481.4063,317.6797,485.4063,313.6797" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="266.021" x2="487.4063" y1="313.6797" y2="313.6797"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.3398" x="321.5437" y="292.4717">POST /v1/auth/login</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8335" x="324.7969" y="308.8232">{ email, password }</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg7"><polygon fill="#181818" points="838.4321,389.0859,848.4321,393.0859,838.4321,397.0859,842.4321,393.0859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="503.4063" x2="844.4321" y1="393.0859" y2="393.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.4834" x="574.6775" y="339.1748">SELECT id, email, password_hash,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.6099" x="619.1143" y="355.5264">password_salt, role,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.0425" x="594.8979" y="371.8779">failed_attempts, locked_until</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0117" x="583.9133" y="388.2295">FROM admin WHERE email = ?</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg8"><polygon fill="#181818" points="514.4063,419.4375,504.4063,423.4375,514.4063,427.4375,510.4063,423.4375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="508.4063" x2="854.4321" y1="423.4375" y2="423.4375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.0259" x="517.9063" y="418.5811">{ id, password_hash, salt, failed_attempts, locked_until }</text></g><path d="M200.0024,438.4375 L260.1733,438.4375 L260.1733,446.7891 L250.1733,456.7891 L200.0024,456.7891 L200.0024,438.4375" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="600.1641" style="stroke:#000000;stroke-width:1.5;" width="691.1025" x="200.0024" y="438.4375"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="215.0024" y="452.9326">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="228.2715" x="275.1733" y="451.8564">[account locked AND locked_until &gt; NOW()]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg9"><polygon fill="#181818" points="277.021,507.8438,267.021,511.8438,277.021,515.8438,273.021,511.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="271.021" x2="492.4063" y1="511.8438" y2="511.8438"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.2217" x="346.1028" y="474.2842">423 Locked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.8809" x="311.2732" y="490.6357">{ error: 'Account locked.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.3335" x="289.0469" y="506.9873">Try again after ' + locked_until }</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="200.0024" x2="891.105" y1="520.8438" y2="520.8438"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="143.0161" x="205.0024" y="532.2627">[password does not match]</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg10"><polygon fill="#181818" points="843.4321,586.7344,853.4321,590.7344,843.4321,594.7344,847.4321,590.7344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="503.4063" x2="849.4321" y1="590.7344" y2="590.7344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.749" x="633.5447" y="553.1748">UPDATE admin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0806" x="558.3789" y="569.5264">SET failed_attempts = failed_attempts + 1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.1826" x="617.8279" y="585.8779">WHERE id = adminId</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg11"><polygon fill="#181818" points="843.4321,649.7891,853.4321,653.7891,843.4321,657.7891,847.4321,653.7891" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="503.4063" x2="849.4321" y1="653.7891" y2="653.7891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.2471" x="613.2957" y="616.2295">If failed_attempts &gt;= 5:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.749" x="633.5447" y="632.5811">UPDATE admin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.3071" x="528.2656" y="648.9326">SET locked_until = DATEADD(MINUTE, 15, NOW())</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg12"><polygon fill="#181818" points="277.021,696.4922,267.021,700.4922,277.021,704.4922,273.021,700.4922" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="271.021" x2="492.4063" y1="700.4922" y2="700.4922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.6289" x="328.3992" y="679.2842">401 Unauthorized</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.5991" x="299.9141" y="695.6357">{ error: 'Invalid credentials' }</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="200.0024" x2="891.105" y1="709.4922" y2="709.4922"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="106.3638" x="205.0024" y="720.9111">[password matches]</text><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg13"><polygon fill="#181818" points="843.4321,791.7344,853.4321,795.7344,843.4321,799.7344,847.4321,795.7344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="503.4063" x2="849.4321" y1="795.7344" y2="795.7344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.749" x="633.5447" y="741.8232">UPDATE admin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.7144" x="608.062" y="758.1748">SET failed_attempts = 0,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.3198" x="619.2593" y="774.5264">locked_until = NULL,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.2417" x="615.2983" y="790.8779">last_login_at = NOW()</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg14"><line style="stroke:#181818;stroke-width:1;" x1="503.4063" x2="545.4063" y1="875.1406" y2="875.1406"/><line style="stroke:#181818;stroke-width:1;" x1="545.4063" x2="545.4063" y1="875.1406" y2="888.1406"/><line style="stroke:#181818;stroke-width:1;" x1="504.4063" x2="545.4063" y1="888.1406" y2="888.1406"/><polygon fill="#181818" points="514.4063,884.1406,504.4063,888.1406,514.4063,892.1406,510.4063,888.1406" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.5254" x="546.5276" y="821.2295">Generate JWT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.6416" x="511.4695" y="837.5811">(sub=adminId, role=admin,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.0181" x="515.2813" y="853.9326">iat=NOW, exp=NOW+8h)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7681" x="510.4063" y="870.2842">HMAC-SHA256 with secret</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg15"><polygon fill="#181818" points="843.4321,947.1953,853.4321,951.1953,843.4321,955.1953,847.4321,951.1953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="503.4063" x2="849.4321" y1="951.1953" y2="951.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0508" x="627.3938" y="913.6357">INSERT audit_log</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.6719" x="618.5833" y="929.9873">(action='admin.login',</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0127" x="581.9128" y="946.3389">actor='admin', admin_id=adminId)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg16"><polygon fill="#181818" points="277.021,1026.6016,267.021,1030.6016,277.021,1034.6016,273.021,1030.6016" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="271.021" x2="492.4063" y1="1030.6016" y2="1030.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0845" x="357.6714" y="976.6904">200 OK</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.6089" x="306.9092" y="993.042">Set-Cookie: jwt=&lt;token&gt;;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.3853" x="278.021" y="1009.3936">HttpOnly; Secure; SameSite=Strict;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.3379" x="291.5447" y="1025.7451">Path=/admin; Max-Age=28800</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg17"><line style="stroke:#181818;stroke-width:1;" x1="266.021" x2="308.021" y1="1084.3047" y2="1084.3047"/><line style="stroke:#181818;stroke-width:1;" x1="308.021" x2="308.021" y1="1084.3047" y2="1097.3047"/><line style="stroke:#181818;stroke-width:1;" x1="267.021" x2="308.021" y1="1097.3047" y2="1097.3047"/><polygon fill="#181818" points="277.021,1093.3047,267.021,1097.3047,277.021,1101.3047,273.021,1097.3047" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3926" x="273.021" y="1063.0967">Save cookie, redirect</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.9116" x="276.2615" y="1079.4482">admin to dashboard</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg18"><polygon fill="#181818" points="64.8931,1143.0078,54.8931,1147.0078,64.8931,1151.0078,60.8931,1147.0078" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="58.8931" x2="260.021" y1="1147.0078" y2="1147.0078"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.1289" x="109.3926" y="1142.1514">Dashboard page</text></g><path d="M271,1110.3047 L271,1169.3047 L655,1169.3047 L655,1120.3047 L645,1110.3047 L271,1110.3047" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M645,1110.3047 L645,1120.3047 L655,1120.3047 L645,1110.3047" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.6143" x="317.0908" y="1128.7998">Every subsequent API call reads JWT from cookie.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.7959" x="286" y="1145.1514">8h sliding window &#8212; cookie Max-Age resets on each request.</text><