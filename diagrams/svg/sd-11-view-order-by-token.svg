;stroke-width:1;" x1="34.7861" x2="219.7568" y1="229.625" y2="229.625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.9707" x="44.2861" y="224.7686">GET /orders/token/abc123xyz</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3"><polygon fill="#181818" points="484.042,255.9766,494.042,259.9766,484.042,263.9766,488.042,259.9766" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="235.7568" x2="490.042" y1="259.9766" y2="259.9766"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.3716" x="262.2136" y="255.1201">GET /v1/orders/by-token/abc123xyz</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg4"><line style="stroke:#181818;stroke-width:1;" x1="506.042" x2="548.042" y1="306.6797" y2="306.6797"/><line style="stroke:#181818;stroke-width:1;" x1="548.042" x2="548.042" y1="306.6797" y2="319.6797"/><line style="stroke:#181818;stroke-width:1;" x1="507.042" x2="548.042" y1="319.6797" y2="319.6797"/><polygon fill="#181818" points="517.042,315.6797,507.042,319.6797,517.042,323.6797,513.042,319.6797" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.4253" x="588.6204" y="285.4717">token_hash =</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.582" x="513.042" y="301.8232">HASHBYTES('SHA2_256', 'abc123xyz')</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg5"><polygon fill="#181818" points="772.4434,476.8438,782.4434,480.8438,772.4434,484.8438,776.4434,480.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="506.042" x2="778.4434" y1="480.8438" y2="480.8438"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.6416" x="561.4219" y="345.1748">SELECT o.id, o.state, o.total,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.3169" x="546.5842" y="361.5264">o.created_at, o.state_changed_at,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.9561" x="555.2646" y="377.8779">o.delivered_at, o.parent_name,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.1733" x="545.156" y="394.2295">oi.product_name, oi.variant_name,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.9961" x="559.2446" y="410.5811">oi.qty, oi.unit_price_snapshot,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.7598" x="582.3628" y="426.9326">oi.line_total_snapshot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.5718" x="600.4568" y="443.2842">FROM orders o</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.5161" x="525.4846" y="459.6357">JOIN order_items oi ON oi.order_id = o.id</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.1006" x="539.1924" y="475.9873">WHERE o.token_hash = token_hash</text></g><path d="M794,370.5586 L794,445.5586 L978,445.5586 L978,380.5586 L968,370.5586 L794,370.5586" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M968,370.5586 L968,380.5586 L978,380.5586 L968,370.5586" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.6289" x="809" y="389.0537">Hash comparison prevents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.4053" x="819.1118" y="405.4053">DB index on raw token.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3062" x="811.1614" y="421.7568">No timing side-channel on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.479" x="840.075" y="438.1084">URL parameter.</text><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg7"><polygon fill="#181818" points="517.042,507.1953,507.042,511.1953,517.042,515.1953,513.042,511.1953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="511.042" x2="788.4434" y1="511.1953" y2="511.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.8208" x="592.8323" y="506.3389">{ order, items: [...] }</text></g><path d="M169.7383,526.1953 L229.9092,526.1953 L229.9092,534.5469 L219.9092,544.5469 L169.7383,544.5469 L169.7383,526.1953" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="310.8672" style="stroke:#000000;stroke-width:1.5;" width="656.3867" x="169.7383" y="526.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="184.7383" y="540.6904">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="89.1978" x="244.9092" y="539.6143">[order not found]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg8"><polygon fill="#181818" points="246.7568,595.6016,236.7568,599.6016,246.7568,603.6016,242.7568,599.6016" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="240.7568" x2="495.042" y1="599.6016" y2="599.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.0044" x="322.8972" y="562.042">404 Not Found</text><text fill="#000000" font-family="sans-serif" font-size="1