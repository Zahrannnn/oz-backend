hAdjust="spacing" textLength="67.9326" x="120.6294" y="182.6748">{ stock: 10 }</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2"><polygon fill="#181818" points="448.4136,230.2344,458.4136,234.2344,448.4136,238.2344,452.4136,234.2344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="250.2983" x2="454.4136" y1="234.2344" y2="234.2344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.5698" x="274.071" y="213.0264">SELECT id, stock, threshold</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.6763" x="271.0178" y="229.3779">FROM variant WHERE id = ?</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg3"><polygon fill="#181818" points="261.2983,279.9375,251.2983,283.9375,261.2983,287.9375,257.2983,283.9375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="255.2983" x2="464.4136" y1="283.9375" y2="283.9375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.8589" x="289.9265" y="279.0811">{ stock: 0, threshold: 5 }</text></g><path d="M475,247.2344 L475,306.2344 L654,306.2344 L654,257.2344 L644,247.2344 L475,247.2344" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M644,247.2344 L644,257.2344 L654,257.2344 L644,247.2344" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3672" x="516.9141" y="265.7295">Old stock was 0.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.6436" x="517.2759" y="282.0811">New stock is 10.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.1953" x="490" y="298.4326">Diff: crossed from 0 to &gt;0.</text><p