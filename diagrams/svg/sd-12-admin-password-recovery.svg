 fill="#EEEEEE" height="24.3516" style="stroke:#000000;stroke-width:2;" width="159.2026" x="323.3235" y="141.2188"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141.5908" x="329.3235" y="158.7139">Admin Requests Reset</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1"><polygon fill="#181818" points="200.1606,193.9219,210.1606,197.9219,200.1606,201.9219,204.1606,197.9219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="53.8931" x2="206.1606" y1="197.9219" y2="197.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.2676" x="63.3931" y="193.0654">Click "Forgot Password"</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg2"><polygon fill="#181818" points="64.8931,224.2734,54.8931,228.2734,64.8931,232.2734,60.8931,228.2734" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="58.8931" x2="211.1606" y1="228.2734" y2="228.2734"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3608" x="85.3464" y="223.417">Enter email form</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg3"><polygon fill="#181818" points="200.1606,254.625,210.1606,258.625,200.1606,262.625,204.1606,258.625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="53.8931" x2="206.1606" y1="258.625" y2="258.625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.1372" x="95.4583" y="253.7686">Submit email</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg4"><polygon fill="#181818" points="437.5459,301.3281,447.5459,305.3281,437.5459,309.3281,441.5459,305.3281" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="222.1606" x2="443.5459" y1="305.3281" y2="305.3281"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.0825" x="244.812" y="284.1201">POST /v1/auth/forgot-password</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46.9727" x="312.3669" y="300.4717">{ email }</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg5"><polygon fill="#181818" points="743.1768,348.0313,753.1768,352.0313,743.1768,356.0313,747.1768,352.0313" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="749.1768" y1="352.0313" y2="352.0313"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.8716" x="506.9255" y="330.8232">SELECT id, email, password_hash</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.0117" x="514.3555" y="347.1748">FROM admin WHERE email = ?</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg6"><polygon fill="#181818" points="470.5459,378.3828,460.5459,382.3828,470.5459,386.3828,466.5459,382.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="464.5459" x2="759.1768" y1="382.3828" y2="382.3828"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="64.3145" x="577.7041" y="377.5264">{ id, email }</text></g><path d="M156.1421,397.3828 L216.313,397.3828 L216.313,405.7344 L206.313,415.7344 L156.1421,415.7344 L156.1421,397.3828" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="338.2734" style="stroke:#000000;stroke-width:1.5;" width="639.7075" x="156.1421" y="397.3828"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="171.1421" y="411.8779">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="89.2085" x="231.313" y="410.8018">[email not found]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg7"><polygon fill="#181818" points="233.1606,445.2617,223.1606,449.2617,233.1606,453.2617,229.1606,449.2617" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="227.1606" x2="448.5459" y1="449.2617" y2="449.2617"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0845" x="313.811" y="444.4053">200 OK</text></g><path d="M464,420.7344 L464,462.7344 L627,462.7344 L627,430.7344 L617,420.7344 L464,420.7344" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M617,420.7344 L617,430.7344 L627,430.7344 L617,420.7344" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0508" x="493.8123" y="439.2295">Always return 200</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.6753" x="479" y="455.5811">(no email enumeration)</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="156.1421" x2="795.8496" y1="469.4375" y2="469.4375"/><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg9"><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="501.5459" y1="509.1406" y2="509.1406"/><line style="stroke:#181818;stroke-width:1;" x1="501.5459" x2="501.5459" y1="509.1406" y2="522.1406"/><line style="stroke:#181818;stroke-width:1;" x1="460.5459" x2="501.5459" y1="522.1406" y2="522.1406"/><polygon fill="#181818" points="470.5459,518.1406,460.5459,522.1406,470.5459,526.1406,466.5459,522.1406" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.7134" x="466.5459" y="487.9326">Generate one_time_code</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.0972" x="472.354" y="504.2842">(6-digit, crypto-random)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg10"><polygon fill="#181818" points="748.1768,597.5469,758.1768,601.5469,748.1768,605.5469,752.1768,601.5469" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="754.1768" y1="601.5469" y2="601.5469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.998" x="527.8623" y="547.6357">INSERT password_recovery</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.5298" x="544.0964" y="563.9873">(admin_id, code_hash,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7808" x="531.4709" y="580.3389">expires_at = NOW + 5 min,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.7944" x="572.4641" y="596.6904">used = false)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg11"><polygon fill="#181818" points="748.1768,660.6016,758.1768,664.6016,748.1768,668.6016,752.1768,664.6016" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="754.1768" y1="664.6016" y2="664.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0508" x="557.8359" y="627.042">INSERT audit_log</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.9209" x="506.4009" y="643.3936">(action='admin.password_recovery',</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="74.7944" x="572.4641" y="659.7451">admin_id=id)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg12"><polygon fill="#181818" points="233.1606,723.6563,223.1606,727.6563,233.1606,731.6563,229.1606,727.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="227.1606" x2="448.5459" y1="727.6563" y2="727.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0845" x="313.811" y="690.0967">200 OK</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.7627" x="259.4719" y="706.4482">{ message: 'If email exists,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66.8091" x="302.4487" y="722.7998">code sent' }</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg13"><polygon fill="#181818" points="64.8931,804.8867,54.8931,808.8867,64.8931,812.8867,60.8931,808.8867" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="58.8931" x2="216.1606" y1="808.8867" y2="808.8867"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.231" x="81.9114" y="787.6787">"Check the app for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.9482" x="81.5527" y="804.0303">the recovery code"</text></g><path d="M227,747.6563 L227,838.6563 L454,838.6563 L454,757.6563 L444,747.6563 L227,747.6563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M444,747.6563 L444,757.6563 L454,757.6563 L444,747.6563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.0571" x="275.5854" y="766.1514">Per interview decision:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8672" x="283.1804" y="782.5029">- No email reset link</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4897" x="244.8691" y="798.8545">- One-time code displayed in-app</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.228" x="242" y="815.2061">- Admin registers using email from</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2451" x="244.4915" y="831.5576">owner, enters code on login page</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="805.8496" x="0" y="865.5898"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="805.8496" y1="865.5898" y2="865.5898"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="805.8496" y1="868.5898" y2="868.5898"/><rect fill="#EEEEEE" height="24.3516" style="stroke:#000000;stroke-width:2;" width="138.2363" x="333.8066" y="854.4141"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120.6245" x="339.8066" y="871.9092">Admin Enters Code</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg15"><polygon fill="#181818" points="200.1606,907.1172,210.1606,911.1172,200.1606,915.1172,204.1606,911.1172" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="53.8931" x2="206.1606" y1="911.1172" y2="911.1172"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.8926" x="82.0806" y="906.2607">Enter 6-digit code</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg16"><polygon fill="#181818" points="437.5459,953.8203,447.5459,957.8203,437.5459,961.8203,441.5459,957.8203" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="222.1606" x2="443.5459" y1="957.8203" y2="957.8203"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.6289" x="232.5388" y="936.6123">POST /v1/auth/verify-recovery-code</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3862" x="294.6602" y="952.9639">{ email, code }</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg17"><polygon fill="#181818" points="743.1768,1098.6328,753.1768,1102.6328,743.1768,1106.6328,747.1768,1102.6328" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="749.1768" y1="1102.6328" y2="1102.6328"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.7471" x="537.9878" y="983.3154">SELECT id, code_hash,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.3926" x="559.665" y="999.667">expires_at, used</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.5972" x="530.0627" y="1016.0186">FROM password_recovery</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3672" x="546.6777" y="1032.3701">WHERE admin_id IN</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.5835" x="476.0696" y="1048.7217">(SELECT id FROM admin WHERE email = ?)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.5244" x="556.5991" y="1065.0732">AND used = false</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.6753" x="521.0237" y="1081.4248">ORDER BY created_at DESC</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.6309" x="469.0459" y="1097.7764">OFFSET 0 ROWS FETCH NEXT 1 ROW ONLY</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg18"><polygon fill="#181818" points="470.5459,1128.9844,460.5459,1132.9844,470.5459,1136.9844,466.5459,1132.9844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="464.5459" x2="759.1768" y1="1132.9844" y2="1132.9844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.1333" x="518.7947" y="1128.1279">{ code_hash, expires_at, used }</text></g><path d="M156.1421,1147.9844 L216.313,1147.9844 L216.313,1156.3359 L206.313,1166.3359 L156.1421,1166.3359 L156.1421,1147.9844" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="471.5156" style="stroke:#000000;stroke-width:1.5;" width="639.7075" x="156.1421" y="1147.9844"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="171.1421" y="1162.4795">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="182.4722" x="231.313" y="1161.4033">[code_expired (NOW &gt; expires_at)]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg19"><polygon fill="#181818" points="233.1606,1217.3906,223.1606,1221.3906,233.1606,1225.3906,229.1606,1221.3906" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="227.1606" x2="448.5459" y1="1221.3906" y2="1221.3906"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57.1035" x="307.3015" y="1183.8311">410 Gone</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.0454" x="272.8306" y="1200.1826">{ error: 'Code expired.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.0708" x="272.8179" y="1216.5342">Request a new one.' }</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="156.1421" x2="795.8496" y1=