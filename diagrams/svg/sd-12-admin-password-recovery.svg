1425.6875"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.0571" x="525.3328" y="1388.1279">UPDATE password_recovery</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.3008" x="562.7109" y="1404.4795">SET used = true</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.8198" x="526.9514" y="1420.8311">WHERE admin_id = adminId</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg23"><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="501.5459" y1="1472.3906" y2="1472.3906"/><line style="stroke:#181818;stroke-width:1;" x1="501.5459" x2="501.5459" y1="1472.3906" y2="1485.3906"/><line style="stroke:#181818;stroke-width:1;" x1="460.5459" x2="501.5459" y1="1485.3906" y2="1485.3906"/><polygon fill="#181818" points="470.5459,1481.3906,460.5459,1485.3906,470.5459,1489.3906,466.5459,1485.3906" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.2871" x="466.5459" y="1451.1826">Generate JWT (same as login,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.1025" x="485.1382" y="1467.5342">sub=adminId, 8h expiry)</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg24"><polygon fill="#181818" points="748.1768,1528.0938,758.1768,1532.0938,748.1768,1536.0938,752.1768,1532.0938" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="459.5459" x2="754.1768" y1="1532.0938" y2="1532.0938"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.0508" x="557.8359" y="1510.8857">INSERT audit_log</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.8281" x="478.9473" y="1527.2373">(action='admin.p